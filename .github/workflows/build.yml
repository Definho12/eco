name: Eco for Windows

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tests (reading MP3/OGG/WAV) and screenshots of the app under a virtual screen.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb > /dev/null
      - name: Fonts
        run: bash ci/fonts.sh
      - name: Test files
        run: bash ci/test-media.sh /tmp/media
      - name: Tests
        run: |
          set -o pipefail
          ECO_TEST_MEDIA=/tmp/media gradle test --no-daemon --console=plain 2>&1 | tee build.log
      - name: Screenshots
        run: |
          set -o pipefail
          mkdir -p /tmp/shots
          export ECO_SCREENSHOT=/tmp/shots/shot.png APPDATA=/tmp/appdata
          timeout 600 xvfb-run -a -s "-screen 0 1400x900x24" gradle run --no-daemon --console=plain 2>&1 | tee -a build.log
          ls -la /tmp/shots
          cp /tmp/appdata/Eco/log.txt /tmp/shots/log.txt || true
      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: |error:|AssertionError|Exception|FAILED|What went wrong" build.log; tail -15 build.log; } | head -45 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Publish screenshots
        run: |
          cd /tmp/shots
          git init -q -b shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "screenshots ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Fonts
        run: bash ci/fonts.sh
      - name: Build
        run: |
          set -o pipefail
          gradle createDistributable packageMsi --no-daemon --console=plain 2>&1 | tee build.log
          cp build/compose/binaries/main/msi/*.msi Eco-Windows.msi
      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: |error:|What went wrong" build.log; tail -15 build.log; } | head -45 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Eco -DestinationPath Eco-Windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Eco para Windows" --notes "Versão mais recente do Eco." --latest
          gh release upload latest Eco-Windows.msi Eco-Windows.zip --clobber
